<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Peccable</title>
  <desc id="logo-description">A custom serif Peccable wordmark beginning with a stylized lowercase p whose coral upper curve is deliberately offset with scanline terminals, chromatic step-repeat layering, and geometric registration marks. Precision with room for imperfection.</desc>
  <!-- Original vector artwork. Letterforms and diagrams are pure paths/shapes: no fonts or raster assets. -->
  <defs>
    <path id="letter-e" fill-rule="evenodd" d="M27 77.5C27.8 97.6 38.8 108.8 54.2 108.8 67.8 108.8 76.2 102.2 82.2 92.8L88.2 96.8C81 110.8 67.8 119 48.8 119 21.8 119 4 101.8 4 75.8 4 49.6 22.2 31 48.2 31 73.2 31 87 46.8 87 72.6V77.5ZM27 69.2H64.8C64.8 49.2 59.6 38.8 47.8 38.8 35.8 38.8 27.8 50.2 27 69.2Z"/>
    <path id="letter-c" d="M79.2 96.8 85.2 100.8C77.2 112.8 64.2 119 48.8 119 21.2 119 4 101.2 4 75.8 4 49.8 23.8 31 50.8 31 69.8 31 83 39.2 83 51.2 83 57.8 78.6 62.2 72.5 62.2 66.2 62.2 61.8 58 61.8 52 61.8 48.2 63 45.4 63 43.2 63 40.4 58.2 38.8 51.8 38.8 36.2 38.8 27 52.6 27 74.2 27 95.8 37.2 108.8 53.2 108.8 64.2 108.8 72.2 104.8 79.2 96.8Z"/>
    <path id="letter-a" fill-rule="evenodd" d="M53 65.8V55.8C53 43.8 47.8 38.8 38.8 38.8 31.5 38.8 25.5 41.2 25.5 44.2 25.5 46.2 28.2 48.8 28.2 53.2 28.2 59 24 63 18 63 12 63 8 59 8 52.8 8 39.8 23.8 31 43 31 65 31 75 40 75 58V100.2C75 107.8 78.2 110.8 87 107.2V113.2C82.8 117.2 77.8 119 71.8 119 62 119 56.2 114.2 54 107 45.2 115.8 37 119 26.8 119 11.8 119 3 110.2 3 97 3 79 21 70.8 53 65.8ZM53 73.8C32.2 76.8 25 83.8 25 94 25 103.8 29.2 108.8 37.2 108.8 43.2 108.8 48.2 105.8 53 100Z"/>
    <path id="letter-b" fill-rule="evenodd" d="M1 8.2 31.2 0 34 2V42.8C41.8 34.8 51 31 62.2 31 87 31 101 48.8 101 74 101 101 83.2 119 59 119 47 119 37.2 115.2 29.2 110L16.2 119H12V22.8C12 15.8 8.8 12.8 1 12.8ZM34 56.8V99.2C38.8 107 46 111 55.2 111 70.2 111 78 97.2 78 75.8 78 54.2 70.2 41 55.2 41 46 41 38.8 45.8 34 56.8Z"/>
    <path id="letter-l" d="M1 8.2 31.8 0 34 2V102.2C34 108.8 37.2 111 46 112V117.2H1V112C9.8 111 13 108.8 13 102.2V22.8C13 15.8 9 12.8 1 12.8Z"/>
    <path id="p-body" d="M83 4C44.8 4 17 31.2 17 70.5V158C17 173.5 12.5 180.5 1 183.2V190H75V183.2C59.2 180.2 54 174.5 54 160V125.5C63.2 135.8 77.2 140 93.5 140 125.8 140 150.2 114.2 152.5 82H118C115.2 102.2 104.8 110.5 90.5 110.5 65.2 110.5 53 91.2 53 72 53 48.2 65.2 35.5 83 35.5Z"/>
  </defs>

  <!-- Archival paper field and subtle reference-plate border -->
  <path fill="#F5F1E8" d="M0 0H1200V400H0Z"/>
  <rect x="24" y="20" width="1152" height="360" rx="4" fill="none" stroke="#E2DAC8" stroke-width="1.25"/>
  <path fill="none" stroke="#BFB5A4" stroke-width="1.25" d="M24 36V20H40M1160 20H1176V36M24 364V380H40M1160 380H1176V364"/>

  <g transform="translate(-120 -54) scale(1.2)">
    <!-- The stylized p is the first letter of the name, not a separate mark. -->
    <g transform="translate(216 160) scale(.7)">
      <!-- Subtle polar construction diagram behind the p bowl (centered at 85, 72) -->
      <circle cx="85" cy="72" r="88" fill="none" stroke="#E4DDD0" stroke-width="1.2"/>
      <circle cx="85" cy="72" r="68" fill="none" stroke="#DDD4C5" stroke-width="1.1"/>
      <path fill="none" stroke="#DFD7C8" stroke-width="1.1" d="M-12 72H182M85-24V168"/>
      <path fill="none" stroke="#C8BEB0" stroke-width="1.3" d="M85-19V-11M176 72H168M-6 72H2"/>

      <!-- Undisplaced "impeccable" blueprint locus & 45-degree offset trajectory -->
      <path fill="none" stroke="#B5ABA0" stroke-width="1.6" stroke-dasharray="4.5 3.5" d="M83 4C122.5 4 152.5 34 152.5 74"/>
      <path fill="none" stroke="#C4B9AA" stroke-width="1.4" stroke-dasharray="3.5 3.5" d="M83 35.5C104 35.5 118 49.5 118 74"/>
      <path fill="none" stroke="#DB533B" stroke-width="1.3" stroke-dasharray="3 3" stroke-opacity=".45" d="M85 72 156 1"/>

      <!-- Center-of-curvature optical registration target -->
      <circle cx="85" cy="72" r="5.5" fill="none" stroke="#C2B8A8" stroke-width="1.2"/>
      <path fill="none" stroke="#9E9486" stroke-width="1.3" d="M76.5 72H93.5M85 63.5V80.5"/>
      <circle cx="85" cy="72" r="1.8" fill="#DB533B"/>

      <!-- Warm stone letterpress relief under p -->
      <use href="#p-body" fill="#DED6C5" x="4" y="4"/>

      <!-- Intermediate chromatic step-repeat echo (Harvest Amber & Educational Teal) -->
      <path fill="#2F7678" d="M87.5-.5H91V31.5H87.5Z"/>
      <path fill="#E59A32" d="M89.5-1.5C130.5-1.5 160.5 27.5 161.5 69H127.5C126.5 45.5 113 31.5 89.5 31.5Z"/>
      <path fill="#F5F1E8" d="M92.2-3.8C133.5-3.8 163.8 25.5 164.8 69H130.5C129.5 44.5 115.5 29.8 92.2 29.8Z"/>

      <!-- Primary charcoal p body with subtle calligraphic counter bevel -->
      <use href="#p-body" fill="#242421"/>
      <path fill="none" stroke="#3D3B36" stroke-width="2" stroke-linecap="round" d="M58.5 72C58.5 53 68 41.2 82.5 39.8"/>

      <!-- Deep Terracotta dimensional bevel under displaced coral segment -->
      <path fill="#9E2B1E" d="M93.2-4.2C131.7-4.2 159.2 19.3 164.2 48.8H127.2C122.9 35 111.7 29.8 93.2 29.8Z"/>

      <!-- Hero displaced coral segment with Paul Rand / CRT scanline terminal -->
      <g fill="#DB533B">
        <path d="M95-6C133.5-6 161 17.5 166 47H129C124.7 33.2 113.5 28 95 28Z"/>
        <path d="M130.6 49.8H166.7C167.2 51.4 167.5 53.1 167.8 54.8H132.8C132.2 53.1 131.5 51.4 130.6 49.8Z"/>
        <path d="M133.6 57.6H168.3C168.5 59.1 168.7 60.6 168.8 62.2H134.6C134.3 60.6 134 59.1 133.6 57.6Z"/>
        <path d="M134.9 65H168.9V69H135Z"/>
      </g>

      <!-- Specular highlight & outer displacement caliper ticks -->
      <path fill="none" stroke="#F07B62" stroke-width="2" stroke-linecap="round" d="M99-1.5C128.5-1.5 151 15 158.5 39"/>
      <path fill="none" stroke="#DB533B" stroke-width="1.6" d="M95-14V-9M172 69H177"/>
      <path fill="none" stroke="#242421" stroke-width="1.6" d="M83-6V-1M156 82H161"/>
    </g>

    <!-- Optical spacing is intentional; repeated letters share exact outlines. -->
    <g transform="translate(339 132) scale(1.06)">
      <!-- Warm stone letterpress relief under eccable -->
      <g fill="#DED6C5" transform="translate(2.6 2.6)">
        <use href="#letter-e" x="0"/>
        <use href="#letter-c" x="92"/>
        <use href="#letter-c" x="181"/>
        <use href="#letter-a" x="271"/>
        <use href="#letter-b" x="363"/>
        <use href="#letter-l" x="471"/>
        <use href="#letter-e" x="522"/>
      </g>

      <!-- Primary charcoal eccable wordmark -->
      <g fill="#242421">
        <use href="#letter-e" x="0"/>
        <use href="#letter-c" x="92"/>
        <use href="#letter-c" x="181"/>
        <use href="#letter-a" x="271"/>
        <use href="#letter-b" x="363"/>
        <use href="#letter-l" x="471"/>
        <use href="#letter-e" x="522"/>
      </g>

      <!-- 1970s/1980s Spectral & Optical Calibration Horizon Bar (collinear with p descender foot) -->
      <g>
        <!-- Coral scanline & deliberately offset block -->
        <path fill="#DB533B" d="M4 141.5H7.2V148H4ZM9.8 141.5H13.5V148H9.8ZM16.2 141.5H20.5V148H16.2ZM23.2 139.3H51V145.8H23.2Z"/>
        <!-- Harvest Amber, Warm Gold, and Educational Teal spectrum blocks -->
        <path fill="#E59A32" d="M54.5 141.5H94.5V148H54.5Z"/>
        <path fill="#E6BF55" d="M98 141.5H132V148H98Z"/>
        <path fill="#2F7678" d="M135.5 141.5H163.5V148H135.5Z"/>

        <!-- Primary architectural rule & continuous lower datum track -->
        <path fill="#242421" d="M168 141.5H609V143.8H168Z"/>
        <path fill="#9C9384" d="M4 146.8H609V148H4Z"/>
        <path fill="#D5CCB9" d="M4 150.8H609V151.9H4Z"/>

        <!-- Optical stem-axis calibration ticks aligned to e-c-c-a-b-l-e -->
        <path fill="#242421" d="M44.4 146.8H45.8V151.9H44.4ZM135.4 146.8H136.8V151.9H135.4ZM314.4 143.8H315.8V151.9H314.4ZM385.4 143.8H386.8V151.9H385.4ZM493.4 143.8H494.8V151.9H493.4ZM566.4 143.8H567.8V151.9H566.4ZM607.6 141.5H609V151.9H607.6Z"/>
        <!-- Coral registration diamond under the second c -->
        <path fill="#DB533B" d="M225 145.2 228.4 148.6 225 152 221.6 148.6Z"/>
      </g>
    </g>
  </g>
</svg>